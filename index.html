function normalizeImportedState(imported){const source=imported?.data||imported||{}; const settings={...defaults.settings,...(source.settings||{})}; if(source.settings?.gasWorkingVolume&&!source.settings?.gasTankCapacity)settings.gasTankCapacity=source.settings.gasWorkingVolume; const trips=Array.isArray(source.trips)?source.trips:[]; const history=Array.isArray(source.history)?source.history:[]; const base={...defaults.base,...(source.base||{})}; if(!source.base){try{const legacy=legacyGasStats(source); base.gasLiters=round2(legacy.left); base.odometer=Math.round(legacy.currentMileage||suggestLegacyMileage(source)||0)}catch{} } return {...clone(defaults),...source,base,settings,calc:{...defaults.calc,...(source.calc||{}),segments:Array.isArray(source.calc?.segments)?source.calc.segments:[]},history:history.map(e=>({...e,id:e.id||uid(),comment:e.comment||'',date:e.date||today(),createdAt:e.createdAt||new Date().toISOString(),updatedAt:e.updatedAt||e.createdAt||new Date().toISOString()})),trips:trips.map(t=>({...t,id:t.id||uid(),date:t.date||today(),comment:t.comment||'',createdAt:t.createdAt||new Date().toISOString(),updatedAt:t.updatedAt||t.createdAt||new Date().toISOString()})),corrections:Array.isArray(source.corrections)?source.corrections:[],petrolLevels:Array.isArray(source.petrolLevels)?source.petrolLevels:[]}}
const DB_NAME='palne-plus-db', DB_STORE='state', DB_KEY='main';
let _db=null;
function openDb(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=e=>e.target.result.createObjectStore(DB_STORE);r.onsuccess=e=>{_db=e.target.result;res(_db)};r.onerror=e=>rej(e.target.error)})}

function legacyGasStats(s){const settings={...defaults.settings,...(s.settings||{})}; const full=[...(s.history||[])].filter(e=>e.fuel==='gas'&&e.fullTank).sort((a,b)=>new Date(b.createdAt||b.date)-new Date(a.createdAt||a.date))[0]; const start=full?parseNum(full.liters)||parseNum(settings.gasWorkingVolume)||32:0; const startMileage=full?parseNum(full.mileage):0; const afterFull=(s.trips||[]).filter(t=>!full||new Date(t.createdAt||t.date)>new Date(full.createdAt||full.date)); const used=afterFull.reduce((a,t)=>a+parseNum(t.km)*(t.mode==='road'?parseNum(settings.gasRoad):parseNum(settings.gasCity))/100,0); const driven=afterFull.reduce((a,t)=>a+parseNum(t.km),0); return {left:Math.max(0,start-used),currentMileage:startMileage+driven}}
function suggestLegacyMileage(s){const a=[...(s.history||[]).map(e=>parseNum(e.mileage)),...(s.trips||[]).map(t=>parseNum(t.odometerAfter))].filter(Boolean); return a.length?Math.max(...a):0}
function allEventsAsc(){const ev=[...state.history.map(e=>({...e,type:'refuel'})),...state.trips.map(t=>({...t,type:'trip'})),...(state.corrections||[]).map(c=>({...c,type:'correction'}))]; return ev.sort((a,b)=>(a.date||'').localeCompare(b.date||'') || new Date(a.createdAt||0)-new Date(b.createdAt||0))}
function recompute(){let gas=parseNum(state.base?.gasLiters),petrol=parseNum(state.base?.petrolLiters),odo=parseNum(state.base?.odometer); const gs=Math.max(.1,parseNum(state.settings.gasCity)), gr=Math.max(.1,parseNum(state.settings.gasRoad)), gasCap=Math.max(.1,parseNum(state.settings.gasTankCapacity)), petCap=Math.max(.1,parseNum(state.settings.petrolTankCapacity)); const tripAfter={}; for(const e of allEventsAsc()){if(e.type==='refuel'){if(e.fuel==='gas'){gas=e.fullTank?gasCap:Math.min(gasCap,gas+parseNum(e.liters)); if(parseNum(e.price)>0){} } else {petrol=e.fullTank?petCap:Math.min(petCap,petrol+parseNum(e.liters))} if(parseNum(e.mileage)>0)odo=parseNum(e.mileage)} else if(e.type==='trip'){const km=parseNum(e.km); gas=Math.max(0,gas-km*(e.mode==='road'?gr:gs)/100); odo+=km; tripAfter[e.id]=Math.round(odo)} else if(e.type==='correction'){if(e.kind==='gas')gas=Math.max(0,Math.min(gasCap,parseNum(e.value))); if(e.kind==='petrol')petrol=Math.max(0,Math.min(petCap,parseNum(e.value))); if(e.kind==='odometer')odo=parseNum(e.value)}} return {gas:round2(gas),petrol:round2(petrol),odometer:Math.round(odo),tripAfter}}
function current(){return recompute()}
function odometerAtDate(date,skipCorrectionId=null){let odo=parseNum(state.base?.odometer); const events=allEventsAsc().filter(e=>!(e.type==='correction'&&e.id===skipCorrectionId)).filter(e=>(e.date||'')<=date); for(const e of events){if(e.type==='refuel'){if(parseNum(e.mileage)>0)odo=parseNum(e.mileage)} else if(e.type==='trip'){odo+=parseNum(e.km)} else if(e.type==='correction'&&e.kind==='odometer'){odo=parseNum(e.value)}} return Math.round(odo)}
function gasStats(){const c=current(), left=c.gas, cap=Math.max(.1,parseNum(state.settings.gasTankCapacity)), cityCons=Math.max(.1,parseNum(state.settings.gasCity)), roadCons=Math.max(.1,parseNum(state.settings.gasRoad)), price=parseNum(state.settings.lastGasPrice); const percent=Math.max(0,Math.min(100,left/cap*100)); const cityKm=left/cityCons*100, roadKm=left/roadCons*100; return {left,cap,percent,cityKm,roadKm,odometer:c.odometer,cityCost1:cityCons*price/100,roadCost1:roadCons*price/100,refuelCityAt:c.odometer+cityKm,refuelRoadAt:c.odometer+roadKm,warn:percent<=parseNum(state.settings.gasWarningPercent)||cityKm<=parseNum(state.settings.gasWarningKm)}}
function progressColor(percent){const p=Math.max(0,Math.min(100,percent)); if(p>=50)return '#22c55e'; if(p<=10){const t=p/10; return mix('#ef4444','#f59e0b',t)} const t=(p-10)/40; return mix('#f59e0b','#22c55e',t)} function mix(a,b,t){const ah=parseInt(a.slice(1),16),bh=parseInt(b.slice(1),16),ar=ah>>16&255,ag=ah>>8&255,ab=ah&255,br=bh>>16&255,bg=bh>>8&255,bb=bh&255; const r=Math.round(ar+(br-ar)*t),g=Math.round(ag+(bg-ag)*t),bl=Math.round(ab+(bb-ab)*t); return '#'+((1<<24)+(r<<16)+(g<<8)+bl).toString(16).slice(1)}

function vertBarGauge(bars,interactive=false){
  const segs=[];
  for(let i=1;i<=9;i++){
    const f=i<=bars;
    const bg=barColor(i,bars);
    const bd=barBorder(i,bars);

function petrolKmPerBar(){const lvls=[...(state.petrolLevels||[])].sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt));if(lvls.length<2)return null;const segments=[];for(let i=1;i<lvls.length;i++){const prev=lvls[i-1],cur=lvls[i];const barsDiff=prev.bars-cur.bars;if(barsDiff<=0)continue;const t1=new Date(prev.createdAt),t2=new Date(cur.createdAt);const tripsInRange=state.trips.filter(t=>{const tc=new Date(t.createdAt||t.date);return tc>=t1&&tc<=t2});const km=tripsInRange.reduce((a,t)=>a+parseNum(t.km),0);if(km>0)segments.push({km,bars:barsDiff,kmpb:km/barsDiff})}if(!segments.length)return null;const totalKm=segments.reduce((a,s)=>a+s.km,0);const totalBars=segments.reduce((a,s)=>a+s.bars,0);return Math.round(totalKm/totalBars)}

function calcStats(){const price=parseNum(state.calc?.price)||parseNum(state.settings.lastGasPrice), cityCons=parseNum(state.settings.gasCity), roadCons=parseNum(state.settings.gasRoad), multiplier=state.calc?.roundTrip?2:1; const segs=state.calc?.segments||[]; const cityKmRaw=segs.filter(s=>s.mode!=='road').reduce((a,s)=>a+parseNum(s.km),0), roadKmRaw=segs.filter(s=>s.mode==='road').reduce((a,s)=>a+parseNum(s.km),0), cityKm=cityKmRaw*multiplier, roadKm=roadKmRaw*multiplier, totalKm=cityKm+roadKm, liters=cityKm*cityCons/100+roadKm*roadCons/100, totalCost=liters*price, left=current().gas, tank=Math.max(.1,parseNum(state.settings.gasTankCapacity)), missing=Math.max(0,liters-left), refuels=liters>0?Math.ceil(missing/tank):0; const people=state.calc?.shared?Math.max(1,parseInt(state.calc.passengers||1)+(state.calc.includeDriver?1:0)):1; return {price,segs,multiplier,cityKmRaw,roadKmRaw,cityKm,roadKm,totalKm,liters,totalCost,left,tank,missing,refuels,people,perPerson:totalCost/people}}

function historyPage(){
  const ev=allEventsChrono(), groups={};
  ev.forEach(x=>{const d=x.date||today();(groups[d]||(groups[d]=[])).push(x)});
  const days=Object.keys(groups).sort((a,b)=>new Date(b)-new Date(a));
  const cutoff=new Date(); cutoff.setDate(cutoff.getDate()-_historyWeeksShown*7);
  const cutStr=cutoff.toISOString().slice(0,10);
  const visibleDays=days.filter(d=>d>=cutStr);
  const hasMore=days.some(d=>d<cutStr);
  return `<div class="grid"><section class="card col-12"><div class="row between" style="margin-bottom:12px"><div><h2>📒 Історія</h2><div class="muted">Заправки, поїздки й ручні корекції в хронологічному порядку, погруповані по днях.</div></div><div class="row"><button class="btn secondary" data-action="openGasRefuel">+ Газ</button><button class="btn secondary" data-action="openPetrolRefuel">+ Бензин</button><button type="button" class="btn danger" data-action="clearAllHistory">Видалити всю історію</button></div></div>${visibleDays.length?visibleDays.map(d=>{const dayKm=groups[d].filter(x=>x.type==='trip').reduce((a,x)=>a+parseNum(x.km),0);const kmLabel=dayKm>0?` · ${fmt(dayKm,1)} км`:'';return `<section class="date-group"><div class="date-title">${dateLabel(d)} <span>${groups[d].length} запис(и)${kmLabel}</span></div><div class="list">${groups[d].map(historyEventHtml).join('')}</div></section>`}).join(''):`<div class="muted">Історія порожня.</div>`}${hasMore?`<div class="hist-load-more"><button data-action="historyLoadMore">⬆️ Завантажити ще 2 тижні</button></div>`:''}</section></div>`;
}
function periodRange(){const now=new Date(); if(state.statsPeriod==='custom')return {from:state.statsFrom||today(),to:state.statsTo||today()}; if(state.statsPeriod==='year')return {from:`${now.getFullYear()}-01-01`,to:`${now.getFullYear()}-12-31`}; if(state.statsPeriod==='month')return {from:new Date(now.getFullYear(),now.getMonth(),1).toISOString().slice(0,10),to:new Date(now.getFullYear(),now.getMonth()+1,0).toISOString().slice(0,10)}; const day=now.getDay()||7, monday=new Date(now); monday.setDate(now.getDate()-day+1); return {from:monday.toISOString().slice(0,10),to:today()}}
function statsPage(){const {from,to}=periodRange(); const trips=state.trips.filter(t=>(t.date||'')>=from&&(t.date||'')<=to); const by={}; trips.forEach(t=>{const d=t.date||today(); by[d]||(by[d]={city:0,road:0}); by[d][t.mode==='road'?'road':'city']+=parseNum(t.km)}); const days=Object.keys(by).sort(); const totalCity=trips.filter(t=>t.mode!=='road').reduce((a,t)=>a+parseNum(t.km),0), totalRoad=trips.filter(t=>t.mode==='road').reduce((a,t)=>a+parseNum(t.km),0), max=Math.max(1,...days.map(d=>by[d].city+by[d].road)); return `<div class="grid"><section class="card col-12"><h2>📊 Статистика пробігу</h2><div class="muted">🟡 місто · 🔵 траса. Статистика рахується тільки по фактично доданих поїздках. Період: ${from} — ${to}.</div><div class="row" style="margin:12px 0"><button class="mini-btn" data-action="setStats" data-value="week">Тиждень</button><button class="mini-btn" data-action="setStats" data-value="month">Місяць</button><button class="mini-btn" data-action="setStats" data-value="year">Рік</button><button class="mini-btn" data-action="setStats" data-value="custom">Свій</button></div>${state.statsPeriod==='custom'?`<div class="form-grid"><div><label>Від</label><input id="statsFrom" type="date" value="${state.statsFrom||today()}"></div><div><label>До</label><input id="statsTo" type="date" value="${state.statsTo||today()}"></div><div class="full"><button class="btn secondary full" data-action="applyStatsCustom">Застосувати</button></div></div>`:''}<div class="stats"><div class="stat city"><div class="value">${fmt(totalCity,1)} км</div><div class="label">місто</div></div><div class="stat road"><div class="value">${fmt(totalRoad,1)} км</div><div class="label">траса</div></div><div class="stat"><div class="value">${fmt(totalCity+totalRoad,1)} км</div><div class="label">разом</div></div></div><div style="margin-top:18px">${days.length?days.map(d=>{const city=by[d].city,road=by[d].road,total=city+road;return `<div class="bar-row"><div><b>${new Date(d+'T12:00:00').toLocaleDateString('uk-UA',{day:'2-digit',month:'2-digit'})}</b></div><div class="bar-track"><div class="bar-city" style="width:${city/max*100}%"></div><div class="bar-road" style="width:${road/max*100}%"></div></div><div class="muted">${fmt(total,1)} км</div></div>`}).join(''):`<div class="muted">За цей період поїздок ще немає.</div>`}</div></section></div>`}

function addCalcSegment(){const km=parseNum(document.getElementById('calcKm')?.value), mode=document.getElementById('calcMode')?.value||'city'; if(km<=0)return toast('Введи кілометри'); state.calc.segments.push({id:uid(),km:round1(km),mode}); updateCalcOptions(false); toast('Відрізок додано')} function deleteCalcSegment(id){state.calc.segments=state.calc.segments.filter(s=>s.id!==id); saveState();render()} function copyCalcSegment(id){const s=state.calc.segments.find(x=>x.id===id); if(s)state.calc.segments.push({...s,id:uid()}); saveState();render();toast('Відрізок скопійовано')} function editCalcSegment(id){const s=state.calc.segments.find(x=>x.id===id); if(!s)return; const km=prompt('Кілометри:',String(s.km).replace('.',',')); if(km===null)return; const mode=confirm('ОК = траса, Скасувати = місто')?'road':'city'; s.km=round1(parseNum(km)); s.mode=mode; saveState();render()} function calcSegmentHtml(s){return `<div class="item ${s.mode}"><div class="item-main"><div class="item-title">${s.mode==='road'?'🔵 Траса':'🟡 Місто'} · ${fmt(s.km,1)} км</div></div><div class="row" style="flex-wrap:nowrap"><button class="mini-btn" data-action="editCalcSegment" data-id="${s.id}">Ред.</button><button class="mini-btn" data-action="copyCalcSegment" data-id="${s.id}">Копія</button><button class="mini-btn danger" data-action="deleteCalcSegment" data-id="${s.id}">×</button></div></div>`} function clearCalc(){state.calc.segments=[];saveState();render();toast('Калькулятор очищено')} function updateCalcOptions(doRender=true){state.calc.price=round2(parseNum(document.getElementById('calcPrice')?.value)||state.settings.lastGasPrice);state.calc.roundTrip=!!document.getElementById('calcRoundTrip')?.checked;state.calc.shared=!!document.getElementById('calcShared')?.checked;state.calc.passengers=parseInt(document.getElementById('calcPassengers')?.value||1);state.calc.includeDriver=!!document.getElementById('calcIncludeDriver')?.checked;saveState();if(doRender)render()}

function barDesc(b){return b===0?'Порожньо':b<=2?'🔴 Мало! Варто заправитись':b<=4?'🟡 Менше половини':b<=6?'🟢 Більше половини':b<=8?'🟢 Майже повний':'🟢 Повний бак'}
let _currentLevelBars=5;
function buildInteractiveGauge(bars){_currentLevelBars=bars;const segs=[];for(let i=9;i>=1;i--){const bg=barColor(i,bars);const bd=barBorder(i,bars);segs.push(`<div data-baridx="${i}" style="width:54px;height:28px;border-radius:8px;border:2px solid ${bd};background:${bg};cursor:pointer;transition:all .15s;box-shadow:${i<=bars?'0 2px 6px rgba(0,0,0,.12)':'none'}" onclick="setLevelBar(${i})"></div>`)}return `<div style="display:flex;flex-direction:column;gap:5px">${segs.join('')}</div>`}
function setLevelBar(i){_currentLevelBars=i;const gaugeEl=document.getElementById('levelGaugeInteractive');if(gaugeEl)gaugeEl.innerHTML=buildInteractiveGauge(i);const ro=document.getElementById('levelReadout');if(ro)ro.textContent=i+'/9';const desc=document.getElementById('levelDesc');if(desc)desc.textContent=barDesc(i);}

function exportBackup(showToast=true){const payload={app:'palne-plus',version:17,exportedAt:new Date().toISOString(),data:state}; const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`palne-plus-backup-${today()}.json`; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); if(showToast)toast('Backup експортовано')}
function csvCell(v){const s=String(v??'');return /[;\n\r"]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s} function exportCsv(){const rows=[['type','date','fuel_or_mode','km','liters','price_per_l','sum','mileage','full_tank','comment']];
  for(const lv of (state.petrolLevels||[]).sort((a,b)=>(a.date||'').localeCompare(b.date||''))){rows.push(['рівень_бензину',lv.date,'бензин','','','','','','',lv.bars+'/9 паличок'+(lv.comment?' · '+lv.comment:'')])}
 const events=allEventsAsc(); for(const e of events){if(e.type==='refuel'){rows.push(['заправка',e.date,e.fuel==='gas'?'газ':'бензин','',fmt(e.liters,1),fmt(e.price,1),fmt(parseNum(e.liters)*parseNum(e.price),1),mileageFmt(e.mileage),e.fullTank?'так':'ні',e.comment||''])}else if(e.type==='trip'){const after=current().tripAfter?.[e.id]||e.odometerAfter||''; rows.push(['поїздка',e.date,e.mode==='road'?'траса':'місто',fmt(e.km,1),'','','',after?mileageFmt(after):'', '', e.comment||''])}else if(e.type==='correction'){rows.push(['корекція',e.date,e.kind||'', '', '', '', '', e.kind==='odometer'?mileageFmt(e.value):'', '', e.comment||''])}} const csv='\ufeff'+rows.map(r=>r.map(csvCell).join(';')).join('\n'); const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`palne-plus-history-${today()}.csv`; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); toast('CSV експортовано')}

async function askBackupBeforeDelete(){return new Promise(resolve=>{const root=document.getElementById('modalRoot'); root.innerHTML=`<div class="modal-backdrop"><div class="modal" onclick="event.stopPropagation()"><div class="modal-head"><h2>Зробити backup перед видаленням?</h2></div><div class="muted" style="font-size:15px;line-height:1.55">Перед очищенням історії можна зберегти JSON-файл, щоб потім відновити дані.</div><div class="modal-actions"><button class="btn secondary" id="backupCancel">Скасувати</button><button class="btn secondary" id="backupSkip">Не треба</button><button class="btn good" id="backupMake">Зробити backup</button></div></div></div>`; const done=v=>{root.innerHTML='';resolve(v)}; document.getElementById('backupCancel').onclick=()=>done('cancel');document.getElementById('backupSkip').onclick=()=>done('skip');document.getElementById('backupMake').onclick=()=>done('backup')})}
async function clearAllHistory(){if(!state.history.length&&!state.trips.length&&!(state.corrections||[]).length)return toast('Історія вже порожня'); const backupChoice=await askBackupBeforeDelete(); if(backupChoice==='cancel')return; if(backupChoice==='backup')exportBackup(false); if(backupChoice==='skip'){const really=await askConfirm('Точно видалити всю історію?','Backup не буде створено. Будуть видалені всі заправки, поїздки й корекції. Після видалення ще буде 5 секунд, щоб скасувати дію.','Так, видалити','Скасувати','danger'); if(!really)return} const prev={history:clone(state.history),trips:clone(state.trips),corrections:clone(state.corrections||[]),petrolLevels:clone(state.petrolLevels||[])}; state.history=[];state.trips=[];state.corrections=[];state.petrolLevels=[];saveState();render();toastUndo('Історію видалено.',()=>{state.history=prev.history;state.trips=prev.trips;state.corrections=prev.corrections;state.petrolLevels=prev.petrolLevels;saveState();render();toast('Видалення скасовано')},5)}
async function resetAll(){const ok=await askConfirm('Скинути всі дані програми?','Це видалить історію, поїздки, корекції й налаштування. Після скидання буде 5 секунд, щоб скасувати дію.','Скинути','Скасувати','danger'); if(!ok)return; const prev=clone(state); state=clone(defaults); saveState(); setTheme('light'); render(); setTab('gas'); toastUndo('Дані скинуто.',()=>{state=prev;saveState();setTheme(state.theme||'light');render();setTab(state.activeTab||'gas');toast('Скидання скасовано')},5)}
function toast(msg){clearTimeout(toastTimer);document.getElementById('toastRoot').innerHTML=`<div class="toast">${esc(msg)}</div>`;toastTimer=setTimeout(()=>document.getElementById('toastRoot').innerHTML='',2200)} function toastUndo(msg,undo,sec=5){clearTimeout(undoTimer);let left=sec; const root=document.getElementById('toastRoot'); const draw=()=>{root.innerHTML=`<div class="toast"><span>${esc(msg)} ${left} с</span><button id="undoBtn">Скасувати</button></div>`;document.getElementById('undoBtn').onclick=()=>{clearInterval(undoTimer);root.innerHTML='';undo()}}; draw(); undoTimer=setInterval(()=>{left--; if(left<=0){clearInterval(undoTimer);root.innerHTML=''}else draw()},1000)}
function showTip(el,text){const root=document.getElementById('tipRoot'); const r=el.getBoundingClientRect(); const left=Math.min(window.innerWidth-314,Math.max(14,r.left-260)); const top=Math.min(window.innerHeight-80,Math.max(14,r.bottom+8)); root.innerHTML=`<div class="tip-pop" style="left:${left}px;top:${top}px">${esc(text)}</div>`; clearTimeout(root._timer); root._timer=setTimeout(()=>root.innerHTML='',4200)}
document.addEventListener('click',e=>{const tip=e.target.closest('[data-tip]'); if(tip){e.preventDefault();e.stopPropagation();showTip(tip,tip.dataset.tip);return} const el=e.target.closest('[data-action]'); if(!el){if(!e.target.closest('.tip-pop'))document.getElementById('tipRoot').innerHTML=''; if(!e.target.closest('.nav-shell')){const p=document.getElementById('menuPanel'); if(p)p.classList.remove('open')} return;} e.preventDefault(); e.stopPropagation(); handleAction(el.dataset.action,el.dataset.id,el.dataset.value)}); document.getElementById('menuToggle').addEventListener('click',e=>{e.preventDefault();e.stopPropagation();document.getElementById('menuPanel').classList.toggle('open')}); document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab))); document.getElementById('themeBtn').addEventListener('click',()=>setTheme(state.theme==='dark'?'light':'dark'));

// Odometer widget state
let _odoDelta=0;
let _odoHoldTimer=null;
let _odoHoldInterval=null;

function setOdoMode(m){state._odoMode=m;const mc=document.getElementById('odoModeCity'),mr=document.getElementById('odoModeRoad'),cf=document.getElementById('odoConfirm');if(mc)mc.classList.toggle('active',m==='city');if(mr)mr.classList.toggle('active',m==='road');if(cf){cf.className='odo-confirm '+m}}

function odoStep(dir){
  _odoDelta=Math.max(0,_odoDelta+dir);
  const base=current().odometer;
  const disp=document.getElementById('odoDisplay');
  const delta=document.getElementById('odoDelta');
  if(disp){disp.textContent=mileageFmt(base+_odoDelta)+' км';disp.classList.remove('bump');void disp.offsetWidth;disp.classList.add('bump')}
  if(delta){delta.textContent=(_odoDelta>0?'+':'')+_odoDelta+' км';delta.style.color=_odoDelta>0?'var(--gas)':'var(--muted)'}
  if(navigator.vibrate)navigator.vibrate(6);
}

let _odoHoldFired=false;
function odoStartHold(dir){
  _odoHoldFired=false;
  _odoHoldTimer=setTimeout(()=>{_odoHoldFired=true;_odoHoldInterval=setInterval(()=>odoStep(dir*10),500)},200);
}
function odoStopHold(dir){clearTimeout(_odoHoldTimer);clearInterval(_odoHoldInterval);if(!_odoHoldFired&&dir!==undefined)odoStep(dir)}

function bindOdoWidget(){
  const plus=document.getElementById('odoPlus');
  const minus=document.getElementById('odoMinus');
  const confirm=document.getElementById('odoConfirm');
  if(!plus||!minus||!confirm)return;
  _odoDelta=0;
  const updateDisplay=()=>{const base=current().odometer;const disp=document.getElementById('odoDisplay');const delta=document.getElementById('odoDelta');if(disp)disp.textContent=mileageFmt(base)+' км';if(delta)delta.textContent='+0 км'};
  updateDisplay();
  plus.addEventListener('mousedown',()=>odoStartHold(1));
  plus.addEventListener('touchstart',e=>{e.preventDefault();odoStartHold(1)},{passive:false});
  minus.addEventListener('mousedown',()=>odoStartHold(-1));
  minus.addEventListener('touchstart',e=>{e.preventDefault();odoStartHold(-1)},{passive:false});
  plus.addEventListener('mouseup',()=>odoStopHold(1));
  plus.addEventListener('mouseleave',()=>odoStopHold());
  plus.addEventListener('touchend',()=>odoStopHold(1));
  plus.addEventListener('touchcancel',()=>odoStopHold());
  minus.addEventListener('mouseup',()=>odoStopHold(-1));
  minus.addEventListener('mouseleave',()=>odoStopHold());
  minus.addEventListener('touchend',()=>odoStopHold(-1));
  minus.addEventListener('touchcancel',()=>odoStopHold());
  confirm.addEventListener('click',()=>{
    if(_odoDelta<=0)return toast('Натисни + щоб додати кілометри');
    const mode=state._odoMode||'city';
    addTripRecord({km:_odoDelta,mode,date:today(),comment:''});
    _odoDelta=0;
    const disp=document.getElementById('odoDisplay');
    const delta=document.getElementById('odoDelta');
    if(delta)delta.textContent='+0 км';
    // display updated by render() inside addTripRecord
  });
}

function render(){
  document.getElementById('balanceHeader').innerHTML=balanceHeader();
  document.getElementById('tab-gas').innerHTML=gasPage();
  document.getElementById('tab-petrol').innerHTML=petrolPage();
  document.getElementById('tab-calc').innerHTML=calcPage();
  document.getElementById('tab-history').innerHTML=historyPage();
  document.getElementById('tab-stats').innerHTML=statsPage();
  document.getElementById('tab-settings').innerHTML=settingsPage();
  syncUiChrome();bindDynamicEvents();bindFormattedInputs();
  bindOdoWidget();
}

initApp();
